# nosd monorepo 形状令牌（规范声明）
#
# 消费方：GTK CSS（packages/nosd-gtk-theme/deepin{,-dark}）、Kvantum
# SVG/kvconfig（packages/nosd-kvantum-theme）、packages/nosdshell 的
# Commons/Style.qml。数值的唯一权威来源是
# packages/nosdshell/DESIGN.md §1.4、§1.2；本文件只是把权威值抄成机器
# 可读形式，tools/check-tokens.py 负责发现各处之间的漂移。
#
# 改这里 ≠ 改各处实现。改这里之前先改 DESIGN.md，再逐处对齐。

[radius]
# DESIGN.md §1.4。单位 px。
radiusRow     = 4   # 列表行悬停、导航按钮、启动器按钮、暗色菜单
radiusItem    = 5   # 控制中心格子、设置组首尾行、搜索框、登录按钮
radiusPopup   = 6   # 带箭头弹出层、密码框、快捷开关选中块、插件悬停
radiusWindow  = 8   # 通知气泡、对话框（dtk-window-radius）、浅色菜单
radiusLarge   = 10  # OSD、关机按钮选中块、启动器网格悬停、托盘胶囊

[radius.outline]
# -gtk-outline-radius 是派生值，不占令牌：形状半径 + 焦点环外扩。
# 外扩量取同一规则内的 outline-offset，缺省用此值。
# 正圆/胶囊（50%、100%）不参与判定。
offset = 2

[radius.exempt]
# 不在令牌集合内、但语义上确实应保留的圆角。键是选择器（逗号分隔后逐项
# 精确相等，不做子串匹配），值是该选择器允许的圆角与理由。
# scripts/check-tokens.py 逐条读取，匹配不到就仍报漂移。
# 0px 由 checker 直接放行（刻意直角），无需登记。
switch = { radius = "11px", reason = "DESIGN §3.5.4 开关 40x22 胶囊：圆角=高度一半" }


[border]
# DESIGN.md §1.2 发丝描边：全部控件描边 1px；焦点环额外一圈。
hairline      = 1   # 全部边框的统一宽度
focus_offset  = 1   # 焦点描边相对控件外缘的偏移
focus_width   = 1.5 # 焦点描边宽度（CDS）

[overlay]
# DESIGN.md §1.3 前景叠加阶梯：状态层 = 表面前景色 × α。
# shell 侧是 onSurface 色盖在半透明蒙版上；应用主题底面不透明，
# GTK 落成 @define-color … alpha(<前景色>, α)，Kvantum 由模板把
# mix(surface, on_surface, α) 烘焙成 overlay_* 角色。
idle      = 0.03
subtle    = 0.05
hover     = 0.10
field     = 0.15
strong    = 0.20
checked   = 0.30
press     = 0.50
indicator = 0.25

[controls]
# Qt/Kvantum 侧控件几何（与 KvAdapta 默认一致即可，见 PLAN §5.2）
scroll_width = 8
check_size   = 14
# DESIGN §3.5.4 设置控件几何：shell 与 GTK/Kvantum 共用基准值
# （uiScaleRatio / rowHeightScale 缩放前）。
field_height  = 30  # settingsFieldHeight：文本输入 / 下拉 / 数值框
field_width   = 170 # settingsFieldWidth：设置行右侧控件列宽
row_height    = 36  # settingsRowHeight / detailRowHeight
switch_width  = 40
switch_height = 22
switch_knob   = 18  # 滑块直径，内边距 (22-18)/2 = 2
slider_groove = 2   # 滑槽厚度
slider_knob   = 12  # 滑块圆点直径

[shadow]
# 菜单/提示框阴影深度（Kvantum menu_shadow_depth / tooltip_shadow_depth）
menu   = 5
tooltip = 6

[color]
# 硬编码颜色白名单之外的例外说明：
# - GTK：所有颜色必须走 @define-color，仅允许在文件头部的 defaults 块出现字面值。
# - Kvantum：kvconfig 必须给 [GeneralColors] 全套角色。Kvantum 的
#   polish(QPalette&) 只做 palette = standardPalette()，而 standardPalette()
#   只填这里出现过的角色；漏掉的角色回落到 QPalette 默认构造值（Window
#   #efefef），表现为菜单栏/工具栏/页签栏露出浅灰带。SVG 与 kvconfig 的
#   颜色在 nosDshell 侧由模板渲染（nosd.svg.tpl / nosd.kvconfig.tpl），
#   仓库里的静态版使用默认 accent。
default_accent = "#0c458e"   # 与 nosdshell.conf highlight 的静态值一致
