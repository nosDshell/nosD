# nosDshell → Flea palette contract.
# Rendered to ~/.config/flea/colors.toml; keys overlay the packaged theme
# (~/.local/state/omarchy/current/theme/colors.toml) file by file, key by key.
# Flea watches this file and re-themes live; delete it to fall back to the
# packaged theme. Key names are Flea's colors.toml contract (docs/theme.md
# in the Flea repo), values are nosDshell wallpaper-scheme colors.

# Window ground and primary ink.
background         = "{{colors.background.default.hex}}"
foreground         = "{{colors.on_background.default.hex}}"
# Chrome plane: rail, toolbar, status bar (Flea's "surface" role).
dark_background    = "{{colors.surface_container.default.hex}}"
# Accent: cursor wash, checked state, links — the single accent DDE allows.
accent             = "{{colors.primary.default.hex}}"
# Brighter text for emphasis on dark grounds.
bright_foreground  = "{{colors.on_surface.default.hex}}"
# Muted/metadata ink and its frame tint.
muted              = "{{colors.on_surface_variant.default.hex}}"
dark_foreground    = "{{colors.outline.default.hex}}"

# Urgent/error ink (last "red" wins the urgent role in Flea's parser).
red                = "{{colors.error.default.hex}}"

# File inks.
cyan               = "{{colors.terminal_normal_cyan.default.hex}}"
green              = "{{colors.terminal_normal_green.default.hex}}"

# Tag swatches: Flea tag roles red/orange/yellow/green/blue/magenta/gray.
orange             = "{{colors.tertiary.default.hex}}"
yellow             = "{{colors.terminal_normal_yellow.default.hex}}"
blue               = "{{colors.terminal_normal_blue.default.hex}}"
magenta            = "{{colors.terminal_normal_magenta.default.hex}}"

# Base16 fallbacks Flea reads when the named keys above are absent;
# emitting them also fixes `flea --tui` ANSI mapping.
color0             = "{{colors.terminal_normal_black.default.hex}}"
color1             = "{{colors.error.default.hex}}"
color2             = "{{colors.terminal_normal_green.default.hex}}"
color3             = "{{colors.terminal_normal_yellow.default.hex}}"
color4             = "{{colors.terminal_normal_blue.default.hex}}"
color5             = "{{colors.terminal_normal_magenta.default.hex}}"
color6             = "{{colors.terminal_normal_cyan.default.hex}}"
color7             = "{{colors.terminal_normal_white.default.hex}}"
color8             = "{{colors.terminal_bright_black.default.hex}}"
color9             = "{{colors.terminal_bright_red.default.hex}}"
color10            = "{{colors.terminal_bright_green.default.hex}}"
color11            = "{{colors.terminal_bright_yellow.default.hex}}"
color12            = "{{colors.terminal_bright_blue.default.hex}}"
color13            = "{{colors.terminal_bright_magenta.default.hex}}"
color14            = "{{colors.terminal_bright_cyan.default.hex}}"
color15            = "{{colors.terminal_bright_white.default.hex}}"
